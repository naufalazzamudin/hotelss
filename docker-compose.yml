version: '3.8'

services:
  hotel-it-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotel-it-inventory:latest
    container_name: hotel_it_inventory_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SECRET_CODE=${SECRET_CODE:-INNRATTAN.BJM}
      - DATA_DIR=/app/data
    volumes:
      # Persistent storage volume for database and uploads
      - hotel_it_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hotel_it_data:
    driver: local
